name: Build AirCard IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ipa.yml"
      - "AirCard-iOS/**"
      - "AirliftFFI.xcframework/**"
      - "build-ipa.sh"
      - "project.yml"
      - "AirCard-iOS.xcodeproj/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh Release

      - name: Verify IPA
        run: |
          test -f build/AirCard-iOS.ipa
          ls -lh build/AirCard-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-IPA
          path: build/AirCard-iOS.ipa
          if-no-files-found: error
          retention-days: 7
